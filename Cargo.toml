[package]
name = "BulkDownloadManager"
version = "0.1.0"
description = "Bulk Download Manager — native Rust desktop download manager"
authors = ["VEEDIZ Studio"]
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
egui = "0.37.0"
eframe = "0.37.0"
form_urlencoded = "1.2.2"
httpdate = "1.0.3"
percent-encoding = "2.3.2"
reqwest = { version = "0.13.5", features = ["stream"] }
rfd = "0.17.2"
rusqlite = { version = "0.41.0", features = ["bundled"] }
scraper = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "time", "sync", "macros", "io-util", "net", "fs"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"

[profile.release]
# Slightly smaller/faster binaries; kept simple for a beginner-friendly build.
lto = "thin"
strip = true
