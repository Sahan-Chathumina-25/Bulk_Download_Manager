[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bulk-download-manager"
version = "0.1.0"
description = "Bulk Download Manager — Phase 1 core engine (URL validation, download engine, database, discovery)"
readme = "README.md"
authors = [{ name = "VEEDIZ Studio" }]
requires-python = ">=3.12"
dependencies = [
    "httpx",
    "beautifulsoup4",
]

[project.optional-dependencies]
gui = ["PySide6"]
dev = ["pytest", "pytest-httpserver", "PySide6", "ruff"]

[project.scripts]
bulk-download-manager = "src.main:main"

[tool.setuptools]
packages = ["src", "src.core", "src.providers", "src.database", "src.utils"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
